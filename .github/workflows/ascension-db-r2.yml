name: Publish Ascension database to R2
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      icon_base:
        description: URL prefix of published icon files (<base><name>.png); empty disables search icons
        required: false
        type: string
        default: ''
    secrets:
      ASCENSION_PUBLICATION_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: ascension-database-r2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Local publication policy
        run: |
          echo "::error::R2 publication moved to the WD-backed local controller. Keep this workflow disabled; update source_ref for the local builder and use live_runner.py."
          exit 1

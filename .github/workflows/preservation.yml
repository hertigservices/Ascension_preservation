name: Preservation offline tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tests -v
      - name: Protocol packets
        shell: pwsh
        run: |
          $env:ASC_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP 'ascension-tests'
          python -B tools/test_world_offline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache tool regressions
        shell: pwsh
        run: |
          # Enumerated, not hand-listed: a fixed array is where the next
          # regression test gets forgotten, and a test that ships but never
          # runs is no test at all. The count guard is here because a glob
          # that matches nothing would make this step pass vacuously.
          $tests = Get-ChildItem 'tools/cache-consolidator/tools/test_*.py' | Sort-Object Name
          Write-Host "found $($tests.Count) cache tool test(s)"
          if ($tests.Count -lt 19) { throw "expected at least 19, found $($tests.Count)" }
          foreach ($test in $tests) {
            Write-Host "== $($test.Name)"
            python -B $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
